      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      // a word's time in scene seconds, found by its text in the voice's word times ("a|b" for alternatives)
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const F = (t) => t - S0; // film seconds -> scene seconds
      const tl = gsap.timeline({ paused: true });
      const typeOn = (el, t, n, d) =>
        tl.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "power2.out" }, t);
      const blurOut = (els, t, d = 0.18) => tl.to(els, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power3.in" }, t);

      // the TUI runs: state swaps are hits (0 ms sets), the log prints line by line
      const swap = (from, to, t) => { tl.set(from, { opacity: 0 }, t); tl.set(to, { opacity: 1 }, t); };
      const D = F(TM.drop), M = W("v06", "many"), ORK = W("v05", "or");
      swap("#s2-b0", "#s2-b1", D); swap("#s2-a0", "#s2-a1", D);
      tl.set("#s2-g1", { opacity: 1 }, D); tl.set("#s2-g2", { opacity: 1 }, D + 0.4);
      swap("#s2-b1", "#s2-b2", ORK + 0.7); swap("#s2-a1", "#s2-a2", ORK + 0.9); tl.set("#s2-g3", { opacity: 1 }, ORK + 0.9);

      swap("#s2-a4", "#s2-a5", W("v06", "unreviewed") + 0.4);

      // left column: kicker types on, "meet" grey then cream, "orkestra." resolves

      tl.to("#s2-w-meet", { color: "#f2eee6", duration: 0.3, ease: "power2.inOut" }, ORK + 0.1);
      tl.fromTo("#s2-w-ork", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, ORK - 0.03);
      tl.set("#s2-sub", { opacity: 1 }, ORK + 0.7); typeOn("#s2-sub", ORK + 0.7, 26, 0.55);

      // "many coding agents. one repo. nothing lands unreviewed."
      [["#s2-l1", "many", 20], ["#s2-l2", "one", 10], ["#s2-l3", "nothing", 26]].forEach(([sel, wi, n]) => {
        tl.set(sel, { opacity: 1 }, W("v06", wi) - 0.05);
