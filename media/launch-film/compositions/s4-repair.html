      const TM = window.TM, VO = window.VO;
      const S0 = TM.s4[0], S1 = TM.s4[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      // a word's time in scene seconds, found by its text in the voice's word times ("a|b" for alternatives)
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const F = (t) => t - S0; // film seconds -> scene seconds
      const tl = gsap.timeline({ paused: true });
      const wordIn = (el, t) =>

      wordIn("#s4-w-req", W("v10", "requested"));
      tl.fromTo("#s4-win", { x: 320, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.15);
      line("#s4-l1", W("v10", "requested"));

      tl.to(["#s4-win", "#s4-bound"], { x: 260, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, v11 - 0.32);

      tl.fromTo("#s4-sum1", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, W("v11", "are"));
