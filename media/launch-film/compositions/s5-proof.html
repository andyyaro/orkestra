      const S0 = TM.s5[0], S1 = TM.s5[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      // a word's time in scene seconds, found by its text in the voice's word times ("a|b" for alternatives)

        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }

        return VO[k].start - S0;
      };

        tl.set(el, { opacity: 1 }, t);

      // "Five hundred and fifty-seven tests." The count lands on "tests" (mk-progress-stat's numeral + track)
      wipe("#s5-k", 0.05, 0.4);
      const c0 = W("v12", "557|five"), c1 = W("v12", "tests");
      blurIn("#s5-num", c0 - 0.05, 0.15);
      blurIn("#s5-track", c0 - 0.05, 0.15);
